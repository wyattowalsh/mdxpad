version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
      radix:
        patterns:
          - '@radix-ui/*'
      ai-sdk:
        patterns:
          - '@ai-sdk/*'
          - ai
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/*'
          - playwright

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - ci
