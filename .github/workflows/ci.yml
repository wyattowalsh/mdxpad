# mdxpad CI Pipeline
# Per spec 000-foundational-setup: typecheck, lint, test, build, bench

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Verify lockfile policy
        run: pnpm verify-lockfiles

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Actions pinning policy
        run: |
          mkdir -p ci-reports
          pnpm verify-actions-pinning --mode enforce --report ci-reports/actions-sha-pinning-report.json

      - name: Verify npm audit baseline
        run: pnpm verify-audit-baseline --report ci-reports/npm-audit-baseline-report.json

      - name: Upload CI policy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-policy-diagnostics
          path: |
            ci-reports/actions-sha-pinning-report.json
            ci-reports/npm-audit-baseline-report.json
            .github/policies/npm-audit-baseline.json
            .github/policies/actions-sha-pinning-report.schema.json
          retention-days: 7
          if-no-files-found: warn

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Unit tests
        run: |
          mkdir -p ci-reports
          pnpm test -- --coverage --reporter=default --reporter=junit --outputFile=ci-reports/vitest-junit.xml

      - name: Write quality diagnostics report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-reports
          node - <<'NODE'
          const fs = require('node:fs');
          const jobStatus = process.env.JOB_STATUS ?? 'unknown';
          const status = jobStatus === 'success' ? 'pass' : (jobStatus === 'cancelled' || jobStatus === 'skipped') ? 'warn' : 'fail';
          const severity = status === 'fail' ? 'error' : 'warning';
          const findings = status === 'pass' ? [] : [{ severity, message: `Quality job status: ${jobStatus}` }];
          const report = {
            schemaVersion: '1.0',
            category: 'quality',
            check: 'ci-quality-job',
            status,
            generatedAt: new Date().toISOString(),
            run: {
              repository: process.env.GITHUB_REPOSITORY ?? '',
              workflow: process.env.GITHUB_WORKFLOW ?? '',
              runId: process.env.GITHUB_RUN_ID ?? '',
              runAttempt: process.env.GITHUB_RUN_ATTEMPT ?? '',
              sha: process.env.GITHUB_SHA ?? '',
              ref: process.env.GITHUB_REF ?? '',
              job: process.env.GITHUB_JOB ?? '',
            },
            summary: {
              totalFindings: findings.length,
              blockingFindings: status === 'fail' ? findings.length : 0,
              jobStatus,
            },
            findings,
            metadata: {
              source: 'quality-job',
            },
          };
          fs.writeFileSync('ci-reports/quality-job-report.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-report
          path: ci-reports/vitest-junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-diagnostics
          path: |
            ci-reports/quality-job-report.json
            .github/policies/ci-diagnostic-report.schema.json
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Manual-secret prerequisites for signed/notarized releases:
          # CSC_LINK + CSC_KEY_PASSWORD (+ optional CSC_NAME), APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Generate supply-chain scaffolding and validate artifact arch
        run: pnpm generate-supplychain-scaffold --arch "${{ matrix.arch }}" --report-dir ci-reports

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdxpad-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.blockmap
          retention-days: 7

      - name: Upload supply-chain diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supplychain-${{ matrix.arch }}
          path: |
            ci-reports/sbom/sbom-${{ matrix.arch }}.cdx.json
            ci-reports/provenance/provenance-${{ matrix.arch }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload dist for downstream jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          retention-days: 1

  security:
    name: Security Verification
    runs-on: macos-14
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-arm64
          path: dist/

      - name: Verify security settings
        run: |
          mkdir -p ci-reports
          set -o pipefail
          pnpm verify-security 2>&1 | tee ci-reports/verify-security.log

      - name: Write security diagnostics report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-reports
          node - <<'NODE'
          const fs = require('node:fs');
          const jobStatus = process.env.JOB_STATUS ?? 'unknown';
          const status = jobStatus === 'success' ? 'pass' : (jobStatus === 'cancelled' || jobStatus === 'skipped') ? 'warn' : 'fail';
          const severity = status === 'fail' ? 'error' : 'warning';
          const findings = status === 'pass' ? [] : [{ severity, message: `Security job status: ${jobStatus}` }];
          const report = {
            schemaVersion: '1.0',
            category: 'security',
            check: 'ci-security-job',
            status,
            generatedAt: new Date().toISOString(),
            run: {
              repository: process.env.GITHUB_REPOSITORY ?? '',
              workflow: process.env.GITHUB_WORKFLOW ?? '',
              runId: process.env.GITHUB_RUN_ID ?? '',
              runAttempt: process.env.GITHUB_RUN_ATTEMPT ?? '',
              sha: process.env.GITHUB_SHA ?? '',
              ref: process.env.GITHUB_REF ?? '',
              job: process.env.GITHUB_JOB ?? '',
            },
            summary: {
              totalFindings: findings.length,
              blockingFindings: status === 'fail' ? findings.length : 0,
              jobStatus,
            },
            findings,
            metadata: {
              source: 'security-job',
            },
          };
          fs.writeFileSync('ci-reports/security-job-report.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-diagnostics
          path: |
            ci-reports/security-job-report.json
            ci-reports/verify-security.log
            .github/policies/ci-diagnostic-report.schema.json
          retention-days: 7
          if-no-files-found: warn

  benchmark:
    name: Performance Benchmark
    runs-on: macos-14
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-arm64
          path: dist/

      - name: Run benchmark
        run: pnpm bench

  e2e:
    name: E2E Tests
    runs-on: macos-14
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-arm64
          path: dist/

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  merge_release_gates:
    name: Merge/Release Gates
    runs-on: ubuntu-latest
    needs: [quality, build, security, benchmark, e2e]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evaluate required checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          mkdir -p ci-reports
          node - <<'NODE'
          const fs = require('node:fs');
          const requiredChecks = [
            ['quality', process.env.QUALITY_RESULT ?? 'unknown'],
            ['build', process.env.BUILD_RESULT ?? 'unknown'],
            ['security', process.env.SECURITY_RESULT ?? 'unknown'],
            ['benchmark', process.env.BENCHMARK_RESULT ?? 'unknown'],
            ['e2e', process.env.E2E_RESULT ?? 'unknown'],
          ];
          const failures = requiredChecks.filter(([, result]) => result !== 'success');
          const findings = failures.map(([name, result]) => ({
            severity: 'error',
            message: `Required check '${name}' finished with status '${result}'`,
          }));
          const report = {
            schemaVersion: '1.0',
            category: 'quality',
            check: 'ci-merge-release-gates',
            status: failures.length === 0 ? 'pass' : 'fail',
            generatedAt: new Date().toISOString(),
            run: {
              repository: process.env.GITHUB_REPOSITORY ?? '',
              workflow: process.env.GITHUB_WORKFLOW ?? '',
              runId: process.env.GITHUB_RUN_ID ?? '',
              runAttempt: process.env.GITHUB_RUN_ATTEMPT ?? '',
              sha: process.env.GITHUB_SHA ?? '',
              ref: process.env.GITHUB_REF ?? '',
              job: process.env.GITHUB_JOB ?? '',
            },
            summary: {
              totalFindings: findings.length,
              blockingFindings: findings.length,
              requiredChecks: requiredChecks.map(([name, result]) => ({ name, result })),
            },
            findings,
            metadata: {
              source: 'merge-release-gates',
            },
          };
          fs.writeFileSync('ci-reports/merge-release-gates-report.json', `${JSON.stringify(report, null, 2)}\n`);
          if (failures.length > 0) {
            console.error('Merge/release gates failed.');
            process.exit(1);
          }
          console.log('Merge/release gates passed.');
          NODE

      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merge-release-gates-diagnostics
          path: |
            ci-reports/merge-release-gates-report.json
            .github/policies/ci-diagnostic-report.schema.json
          retention-days: 7
          if-no-files-found: warn
