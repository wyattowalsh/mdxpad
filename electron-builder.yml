# electron-builder configuration for mdxpad
# Per constitution: macOS-first, Electron 39.x

appId: com.mdxpad.app
productName: mdxpad
copyright: 'Copyright (c) 2024'

# Output directories
directories:
  buildResources: resources
  output: release

# Keep architecture in artifact names so CI can validate matrix outputs.
artifactName: '${productName}-${version}-${arch}.${ext}'

# macOS-specific configuration
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: dir
      arch:
        - arm64
        - x64
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

# DMG customization
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Files to include
files:
  - dist/**/*
  - '!dist/main/*.map'
  - '!dist/preload/*.map'

# Keep native sidecar binaries/resources outside app.asar so they remain executable.
extraResources:
  - from: resources/sidecar
    to: sidecar
    filter:
      - '**/*'

# ASAR packaging
asar: true
asarUnpack:
  - '**/*.node'

# Compression
compression: normal

# Notarization hook:
# - Requires APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID.
# - When missing, scripts/notarize.cjs logs and skips (for PR and unsigned CI builds).
afterSign: scripts/notarize.cjs
